# Solyra on Hyprland: macOS-like floating windows, one corner radius, soft
# two-layer shadows, Liquid Glass blur behind the shell, Apple-ish motion.
monitor = , preferred, auto, 1

exec-once = quickshell
exec-once = swaybg -i ~/.config/solyra/wallpaper.png -m fill
source = ~/.config/solyra/hypr-local.conf

general {
    gaps_in = 6
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(ffffff38)
    col.inactive_border = rgba(ffffff14)
    layout = dwindle
}

decoration {
    rounding = 16
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.06
    shadow {
        enabled = true
        range = 28
        render_power = 3
        offset = 0 10
        color = rgba(00000059)
        color_inactive = rgba(00000033)
    }
    blur {
        enabled = true
        size = 9
        passes = 3
        noise = 0.012
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.22
        popups = true
    }
}

animations {
    enabled = true
    bezier = spring, 0.32, 1.25, 0.42, 1.0
    bezier = smooth, 0.25, 0.1, 0.25, 1.0
    animation = windowsIn, 1, 4, spring, popin 88%
    animation = windowsOut, 1, 3, smooth, popin 92%
    animation = windowsMove, 1, 4, spring
    animation = fade, 1, 3, smooth
    animation = layersIn, 1, 3, spring, popin 94%
    animation = layersOut, 1, 2, smooth, fade
    animation = workspaces, 1, 5, smooth, slide
    animation = specialWorkspace, 1, 4, spring, slidevert
}

dwindle {
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    natural_scroll = true
    touchpad { natural_scroll = true }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(101418)
}

# Glass behind the shell's translucent surfaces: blur only where pixels
# are drawn (ignore_alpha), so rounded cards get rounded blur.
layerrule = blur, solyra-(bar|dock|spotlight|control|notifications|snap|overview)
layerrule = ignorealpha 0.02, solyra-(bar|dock|spotlight|control|notifications|snap)
layerrule = animation popin 92%, solyra-(spotlight|control|snap)

# Our translucent apps get the same frosted glass.
windowrule = opacity 0.999 override, class:^(solyra-term|solyra-files|solyra-settings)$

$mod = SUPER
bind = $mod, SPACE, global, solyra:spotlight
bind = $mod, C, global, solyra:control
bind = $mod, L, global, solyra:lock
bind = $mod, Z, global, solyra:snap
bind = $mod, N, global, solyra:island
bind = $mod, RETURN, exec, solyra-term
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating
bind = $mod, UP, global, solyra:overview
bind = , F3, global, solyra:overview
bind = $mod, TAB, workspace, e+1
bind = $mod SHIFT, TAB, workspace, e-1
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q set 5%+ && qs ipc call shell hud brightness $(brightnessctl -m | cut -d, -f4 | tr -d %)
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q set 5%- && qs ipc call shell hud brightness $(brightnessctl -m | cut -d, -f4 | tr -d %)
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
