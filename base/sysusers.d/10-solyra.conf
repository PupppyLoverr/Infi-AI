# Default user for development images. The first-boot setup wizard (P6)
# replaces this with real account creation.
u solyra - "Solyra user" /var/home/solyra /bin/bash
# The first-boot wizard's session user: no login, member of `solyra` so it
# can drop its request file in /var/lib/solyra (mode 0770 root:solyra).
u solyra-setup - "Solyra first-boot setup" /var/empty /sbin/nologin
m solyra-setup solyra
