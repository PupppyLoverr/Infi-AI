# The Solyra test VM: Arch + Hyprland + the Quickshell shell + the zgx
# terminal, booted under QEMU/KVM. A scenario opens every surface and
# screenshots it; idle RAM / disk / boot are measured 5 min after login.
name: solyra-vm
on:
  workflow_dispatch:
  push:
    branches: [claude/charming-goodall-iuca3o]
    paths: ['shell/qs/**', 'shell/hypr/**', 'tools/vm/**', 'apps/solyra-term/**', 'apps/solyra-ui/**', '.github/workflows/vm.yml']
concurrency: { group: solyra-vm, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  term:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Toolchain
        run: pacman -Syu --noconfirm --needed base-devel rust git pkgconf dbus wayland libxkbcommon fontconfig >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/target
          key: term-arch-${{ hashFiles('apps/Cargo.lock') }}
      - name: Build solyra-term (release)
        working-directory: apps
        run: cargo build --locked --release -p solyra-term 2>&1 | tail -5
      - name: Test solyra-term
        working-directory: apps
        run: cargo test --locked --release -p solyra-term 2>&1 | grep -E "test result|FAILED|panicked"
      - uses: actions/upload-artifact@v4
        with: { name: solyra-term, path: apps/target/release/solyra-term }
  vm:
    needs: term
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: solyra-term, path: bin }
      - name: QEMU, KVM and virgl
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y qemu-system-x86 qemu-system-modules-opengl qemu-utils cloud-image-utils libgl1-mesa-dri libegl1 socat >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        with:
          path: out/base.qcow2
          key: solyra-vm-base-${{ hashFiles('tools/vm/setup.sh', 'tools/vm/sync.sh') }}
      - name: Boot, scenario, measure
        run: chmod +x bin/solyra-term && TERM_BIN=$PWD/bin/solyra-term OUT=$PWD/out tools/vm/run.sh
      - name: Budget gate (idle RAM <= 250 MB, installed <= 3 GB)
        run: |
          r=out/shots/report.txt
          [ -f "$r" ] || { echo "no report (session did not reach the measurement)"; exit 1; }
          used=$(awk '/^Mem:/{print $3}' "$r"); disk=$(sed -n 's/^root_used_mb=//p' "$r")
          echo "idle RAM used: ${used} MB (llvmpipe in this VM inflates it) · installed: ${disk} MB"
          echo "budget_ram_mb=${used} budget_disk_mb=${disk}" >> out/shots/report.txt
          [ "${used:-99999}" -le 250 ] && [ "${disk:-99999}" -le 3072 ]
      - name: Publish shots to docs/shots (JPEG) on this branch
        if: always()
        run: |
          ls out/shots >/dev/null 2>&1 || exit 0
          sudo apt-get -qq install -y imagemagick >/dev/null
          rm -rf docs/shots && mkdir -p docs/shots
          for f in out/shots/*.ppm; do [ -f "$f" ] && convert "$f" "${f%.ppm}.png"; done
          for f in out/shots/*.png; do [ -f "$f" ] && convert "$f" -quality 82 "docs/shots/$(basename "${f%.png}").jpg"; done
          cp out/shots/*.txt out/shots/*.log docs/shots/ 2>/dev/null || true
          git config user.name "solyra-ci"; git config user.email "solyra-ci@users.noreply.github.com"
          git add docs/shots
          git commit -qm "solyra-vm shots for ${GITHUB_SHA::7} [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solyra-vm-shots
          path: |
            out/shots/
            out/setup.log
            out/boot.log
