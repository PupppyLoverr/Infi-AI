# The Solyra test VM: Arch + Hyprland + the Quickshell shell + the zgx
# terminal, booted under QEMU/KVM. A scenario opens every surface and
# screenshots it; idle RAM / disk / boot are measured 5 min after login.
name: solyra-vm
on:
  workflow_dispatch:
  push:
    branches: [claude/charming-goodall-iuca3o]
    paths: ['shell/qs/**', 'shell/hypr/**', 'tools/vm/**', 'apps/terminal/**', 'apps/solyra-files/**', 'apps/solyra-term/**', 'apps/solyra-ui/**', 'pkg/**', '.github/workflows/vm.yml']
concurrency: { group: solyra-vm, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  term:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Toolchain
        run: pacman -Syu --noconfirm --needed base-devel rust git pkgconf cmake clang dbus wayland libxkbcommon fontconfig >/dev/null
      - uses: actions/checkout@v4
      # Warm builds: the cargo registry, git checkouts and both target
      # directories survive between runs. An exact key per lockfile, and a
      # prefix fallback so a changed lockfile still starts from the last
      # build instead of from scratch (cargo rebuilds only what changed).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/target
            apps/terminal/target
          key: apps-arch-${{ hashFiles('apps/Cargo.lock', 'apps/terminal/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            apps-arch-${{ hashFiles('apps/Cargo.lock', 'apps/terminal/Cargo.lock') }}-
            apps-arch-
      - name: Build the terminal (zgx terminal app) and the Finder (release)
        run: |
          (cd apps/terminal && cargo build --locked --release 2>&1 | tail -3)
          (cd apps && cargo build --locked --release -p solyra-files -p solyra-term-classic 2>&1 | tail -3)
      - name: Test
        run: |
          (cd apps/terminal && cargo test --locked --release 2>&1 | grep -E "test result|FAILED|panicked")
          (cd apps && cargo test --locked --release -p solyra-term-classic -p solyra-files 2>&1 | grep -E "test result|FAILED|panicked")
      - name: Build the Arch packages (makepkg, reusing the warm target dirs)
        run: |
          pacman -S --noconfirm --needed sudo >/dev/null
          useradd -m builder 2>/dev/null || true
          chown -R builder: "$GITHUB_WORKSPACE"
          for p in solyra-term solyra-files solyra-shell; do
            (cd pkg/$p && sudo -u builder env SOLYRA_REPO="$GITHUB_WORKSPACE" CARGO_HOME=/home/builder/.cargo SOLYRA_PREBUILT=1 makepkg -f --nodeps --nocheck --noconfirm 2>&1 | tail -3)
          done
          chown -R root: "$GITHUB_WORKSPACE"
          ls -la pkg/*/*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: solyra-packages
          path: pkg/*/*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: solyra-term
          path: |
            apps/terminal/target/release/solyra-term
            apps/target/release/solyra-files
  vm:
    needs: term
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: solyra-term, path: bin }
      - name: QEMU, KVM and virgl
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y qemu-system-x86 qemu-system-modules-opengl qemu-utils cloud-image-utils libgl1-mesa-dri libegl1 socat >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        with:
          path: out/base.qcow2
          key: solyra-vm-base-${{ hashFiles('tools/vm/setup.sh', 'tools/vm/sync.sh') }}
      - name: Boot, scenario, measure
        run: chmod -R +x bin && TERM_BIN=$(find $PWD/bin -name solyra-term -type f | head -1) FILES_BIN=$(find $PWD/bin -name solyra-files -type f | head -1) OUT=$PWD/out tools/vm/run.sh
      - name: Budget gate (idle RAM <= 250 MB, installed <= 3 GB)
        run: |
          r=out/shots/report.txt
          [ -f "$r" ] || { echo "no report (session did not reach the measurement)"; exit 1; }
          used=$(awk '/^Mem:/{print $3}' "$r"); disk=$(sed -n 's/^root_used_mb=//p' "$r")
          echo "idle RAM used: ${used} MB (llvmpipe in this VM inflates it) · installed: ${disk} MB"
          echo "budget_ram_mb=${used} budget_disk_mb=${disk}" >> out/shots/report.txt
          [ "${used:-99999}" -le 250 ] && [ "${disk:-99999}" -le 3072 ]
      - name: Publish shots to docs/shots (JPEG) on this branch
        if: always()
        run: |
          ls out/shots >/dev/null 2>&1 || exit 0
          sudo apt-get -qq install -y imagemagick >/dev/null
          mkdir -p /tmp/pub
          for f in out/shots/*.ppm; do [ -f "$f" ] && convert "$f" "${f%.ppm}.png"; done
          for f in out/shots/*.png; do [ -f "$f" ] && convert "$f" -quality 82 "/tmp/pub/$(basename "${f%.png}").jpg"; done
          cp out/shots/*.txt out/shots/*.log out/shots/*.lua /tmp/pub/ 2>/dev/null || true
          tools/ci/publish-shots.sh /tmp/pub docs/shots/vm "solyra-vm shots for ${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solyra-vm-shots
          path: |
            out/shots/
            out/setup.log
            out/boot.log
