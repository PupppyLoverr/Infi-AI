name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plan and docs are present
        run: |
          test -f PLAN.md
          test -f README.md
          test -f docs/design-language.md
          test -f docs/apps.md
          test -f docs/setup.md
          test -f docs/agent-platform.md
          test -f docs/agent-protocol.md
          test -f shell/README.md
      # Info-level findings in these legacy scripts are not gated until the
      # harness is rewired for the new layout (tests/drive/README.md).
      - name: Shellcheck the drive harness
        run: shellcheck -S warning tests/drive/*.sh
      - name: Shellcheck the image and session scripts
        run: shellcheck -S warning scripts/build-disk.sh base/solyra-session

  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the niri release binary
        run: |
          docker build -f comp/dev.Containerfile -t solyra-dev:ci comp/
          mkdir -p comp/out
          docker run --rm -v "$PWD/comp:/src" solyra-dev:ci sh -ec '
            CARGO_PROFILE_RELEASE_STRIP=symbols CARGO_PROFILE_RELEASE_LTO=off \
              cargo build --locked --release -p niri -j 2
            install -m 755 target/release/niri out/niri
          '
      - name: Build the shell panel
        run: |
          mkdir -p shell/out
          docker run --rm -v "$PWD:/repo" -w /repo/shell/panel solyra-dev:ci \
            sh -ec 'cargo build --locked --release &&
                    install -m 755 target/release/solyra-panel ../out/solyra-panel'
      - name: Test the shell panel
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/shell/panel solyra-dev:ci \
            sh -ec 'cargo test --locked'
      - name: Build the desktop image and validate its config
        run: |
          docker build -f base/Containerfile -t solyra-base:ci .
          docker run --rm --entrypoint cat solyra-base:ci /etc/solyra/comp.kdl | cmp base/solyra-config.kdl -
