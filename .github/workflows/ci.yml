name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plan and docs are present
        run: |
          test -f PLAN.md
          test -f README.md
          test -f docs/design-language.md
          test -f docs/agent-platform-legacy.md
      - name: Shellcheck the drive harness
        run: shellcheck tests/drive/*.sh

  # P1 replaces this with the real bootc image build (see PLAN.md §4).
  image-build-placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Image build lands in P1 — base/Containerfile"
