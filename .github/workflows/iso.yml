# M8: build the Solyra ISO (archiso), enforce < 3 GB, boot it in QEMU/KVM
# and screenshot the live desktop from the guest display.
name: solyra-iso
on:
  workflow_dispatch:
  push:
    branches: [claude/charming-goodall-iuca3o]
    paths: ['iso/**', 'shell/**', 'apps/solyra-term/**', '.github/workflows/iso.yml']
concurrency: { group: solyra-iso, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            apps/target
          key: iso-term-${{ hashFiles('apps/Cargo.lock') }}
      - name: Build solyra-term and the ISO (Arch container)
        run: |
          mkdir -p out
          docker run --rm --privileged -v "$PWD:/repo" -w /repo -e CARGO_HOME=/repo/.cargo-home archlinux:latest bash -ec '
            pacman -Syu --noconfirm --needed base-devel rust git pkgconf dbus wayland libxkbcommon fontconfig >/dev/null
            (cd apps && cargo build --locked --release -p solyra-term 2>&1 | tail -3)
            bash iso/build.sh apps/target/release/solyra-term /repo/out'
          ls -la out
      - name: Size budget (< 3 GB)
        run: |
          iso=$(ls out/*.iso); size=$(stat -c %s "$iso"); echo "ISO $(basename $iso): $((size/1024/1024)) MiB"
          echo "iso_mib=$((size/1024/1024))" > out/iso-report.txt
          [ "$size" -lt 3221225472 ]
      - name: Boot the ISO and screenshot the live desktop
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y qemu-system-x86 imagemagick socat >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          iso=$(ls out/*.iso)
          qemu-system-x86_64 -accel kvm -cpu host -m 4096 -smp 2 -device virtio-vga -display none \
            -cdrom "$iso" -boot d -nic user,model=virtio -monitor unix:mon.sock,server,nowait -daemonize
          mkdir -p docs/shots/iso
          for t in 60 150 240; do
            sleep $((t - ${last:-0})); last=$t
            echo "screendump /tmp/iso-$t.ppm" | socat - UNIX-CONNECT:mon.sock >/dev/null; sleep 2
            convert /tmp/iso-$t.ppm -quality 82 docs/shots/iso/boot-${t}s.jpg && echo "shot iso-boot-${t}s"
          done
          echo "quit" | socat - UNIX-CONNECT:mon.sock >/dev/null || true
          cp out/iso-report.txt docs/shots/iso/
      - name: Publish shots
        if: always()
        run: |
          tools/ci/publish-shots.sh docs/shots/iso docs/shots/iso "solyra-iso boot shots for ${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with: { name: solyra-iso, path: out/*.iso, retention-days: 7, compression-level: 0 }
