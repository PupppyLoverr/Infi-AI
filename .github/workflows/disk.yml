name: disk

# Builds the Solyra development disk image, boots it once headless as a smoke
# test, and publishes it as a downloadable artifact.
#
# What the smoke test proves: the disk boots under UEFI, the kernel and systemd
# come up, and the serial console reaches a login prompt. It does NOT prove the
# graphical desktop: niri needs a GL-capable virtual GPU, which a headless CI
# runner does not have. Run the disk with scripts/run-vm.sh to see the desktop.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']

# Only the newest push builds; older runs on the same branch are cancelled.
concurrency:
  group: disk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          # /mnt is root-owned on the runner; the later steps write there as the runner user.
          sudo chown "$USER" /mnt
          df -h / /mnt

      - name: Build the compositor and the shell, run the shell tests
        run: |
          docker build -f comp/dev.Containerfile -t solyra-dev:ci comp/
          mkdir -p comp/out shell/out
          docker run --rm -v "$PWD/comp:/src" solyra-dev:ci sh -ec '
            CARGO_PROFILE_RELEASE_STRIP=symbols CARGO_PROFILE_RELEASE_LTO=off \
              cargo build --locked --release -p niri -j 3
            install -m 755 target/release/niri out/niri'
          docker run --rm -v "$PWD:/repo" -w /repo/shell/panel solyra-dev:ci sh -ec '
            cargo test --locked
            cargo build --locked --release
            install -m 755 target/release/solyra-panel ../out/solyra-panel'

      - name: Build and test the zgx apps
        run: |
          mkdir -p apps/out
          # zgx needs Rust 1.95+ (edition 2024); the Fedora package may be older.
          docker run --rm -v "$PWD:/repo" -w /repo/apps solyra-dev:ci sh -ec '
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            . "$HOME/.cargo/env"
            rustc --version
            export CARGO_NET_GIT_FETCH_WITH_CLI=true CARGO_PROFILE_DEV_DEBUG=0
            cargo test --locked
            cargo build --locked --release -j 3
            for b in solyra-settings solyra-term solyra-browse solyra-files solyra-setup; do install -m 755 target/release/$b out/$b; done
            cd /repo/crates/solyra-setup-core
            cargo test --locked
            cargo build --locked --release
            install -m 755 target/release/solyra-setup-apply /repo/apps/out/solyra-setup-apply
            cd /repo/agent
            cargo test --locked
            cargo build --locked --release
            install -m 755 target/release/solyra-agent /repo/apps/out/solyra-agent'
          ls -l apps/out

      - name: Build the OS image and validate the session config
        run: |
          docker build -f base/Containerfile -t solyra-base:ci .
          docker run --rm --entrypoint cat solyra-base:ci /etc/solyra/comp.kdl | cmp base/solyra-config.kdl -
          docker run --rm solyra-base:ci /usr/bin/solyra-comp validate -c /etc/solyra/comp.kdl
          docker image inspect solyra-base:ci --format 'image size: {{.Size}} bytes'
          # Fail loudly if an expected program is missing from the image.
          docker run --rm --entrypoint sh solyra-base:ci -ec '
            for b in solyra-comp solyra-panel solyra-agent solyra-settings solyra-term solyra-browse solyra-files solyra-setup solyra-setup-apply solyra-install bwrap foot thunar firefox mousepad ristretto galculator wtype wpctl brightnessctl nmtui agreety swaylock; do
              command -v "$b" >/dev/null || { echo "missing in image: $b"; exit 1; }
            done
            systemctl is-enabled greetd.service'

      - name: Self-test the zgx apps in the image (headless Wayland, software Vulkan)
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          docker run --rm -v "$RUNNER_TEMP/shots:/shots" --entrypoint sh solyra-base:ci -ec '
            dnf -y install weston >/dev/null
            mkdir -p /tmp/xr && chmod 700 /tmp/xr
            export XDG_RUNTIME_DIR=/tmp/xr
            weston --backend=headless --socket=wl-ci --width=1280 --height=800 >/tmp/weston.log 2>&1 &
            sleep 4
            export WAYLAND_DISPLAY=wl-ci VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
            for app in solyra-settings solyra-term solyra-browse solyra-files solyra-setup; do
              echo "== $app --self-test"
              timeout 90 $app --self-test
            done
            kill %1 || true
            # Screenshots: a pixman-rendered kiosk session, one app at a time.
            shoot() {
              name=$1; shift
              weston --backend=headless --renderer=pixman --shell=kiosk --debug \
                --socket=wl-shot --width=1100 --height=700 >/tmp/weston-shot.log 2>&1 &
              W=$!
              sleep 3
              WAYLAND_DISPLAY=wl-shot SHELL=/bin/bash timeout 60 "$@" >/tmp/$name.log 2>&1 &
              A=$!
              sleep 12
              ( cd /shots && WAYLAND_DISPLAY=wl-shot timeout 15 weston-screenshooter >/dev/null 2>&1 || true
                f=$(ls -t wayland-screenshot*.png 2>/dev/null | head -1)
                [ -n "$f" ] && mv "$f" "$name.png" )
              kill $A $W 2>/dev/null || true
              wait $A $W 2>/dev/null || true
            }
            export HOME=/tmp/shot-home
            mkdir -p $HOME/.config/solyra
            printf "theme=dark\naccent=blue\n" > $HOME/.config/solyra/shell.conf
            shoot settings-appearance solyra-settings
            shoot settings-desktop solyra-settings --page desktop
            shoot settings-lock solyra-settings --page "lock screen"
            shoot terminal solyra-term
            shoot browse solyra-browse about:blank
            mkdir -p "$HOME/Documents" "$HOME/Pictures"
            printf 'Solyra Files smoke test\n' > "$HOME/Documents/Welcome notes.txt"
            shoot files solyra-files "$HOME"
            printf "theme=light\naccent=teal\n" > $HOME/.config/solyra/shell.conf
            shoot settings-light solyra-settings
            shoot setup solyra-setup
            ls -l /shots'
          # The terminal must show its shell, not an empty pane: rows below
          # the tab strip may not all be one colour.
          python3 - "$RUNNER_TEMP/shots/terminal.png" <<'PY'
          import os, sys, zlib, struct
          if not os.path.exists(sys.argv[1]):
              print("::warning::no terminal screenshot (weston-screenshooter missing?); blank-pane check skipped")
              sys.exit(0)
          data = open(sys.argv[1], 'rb').read()
          w, h = struct.unpack('>II', data[16:24])
          bitdepth, ctype = data[24], data[25]
          idat = b''
          i = 8
          while i < len(data):
              n = struct.unpack('>I', data[i:i+4])[0]
              t = data[i+4:i+8]
              if t == b'IDAT':
                  idat += data[i+8:i+8+n]
              i += 12 + n
          raw = zlib.decompress(idat)
          bpp = {2: 3, 6: 4}[ctype]
          stride = w * bpp
          rows, prev, p = [], bytearray(stride), 0
          for y in range(h):
              f = raw[p]; line = bytearray(raw[p+1:p+1+stride]); p += 1 + stride
              for x in range(stride):
                  a = line[x-bpp] if x >= bpp else 0
                  b = prev[x]; c = prev[x-bpp] if x >= bpp else 0
                  if f == 1: line[x] = (line[x] + a) & 255
                  elif f == 2: line[x] = (line[x] + b) & 255
                  elif f == 3: line[x] = (line[x] + (a + b) // 2) & 255
                  elif f == 4:
                      pa, pb, pc = abs(b - c), abs(a - c), abs(a + b - 2 * c)
                      pr = a if pa <= pb and pa <= pc else (b if pb <= pc else c)
                      line[x] = (line[x] + pr) & 255
              rows.append(bytes(line)); prev = line
          body = set()
          for y in range(60, min(h, 160)):
              r = rows[y]
              for x in range(0, stride, bpp):
                  body.add(r[x:x+3])
          print(f"terminal screenshot {w}x{h}: {len(body)} colours under the tab strip")
          sys.exit(0 if len(body) > 2 else 'terminal pane is blank: the shell is not visible')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: ignore

      - name: Install disk tooling
        run: |
          # Ubuntu's mirrors sometimes drop connections: retry, then retry the
          # whole install once more after a pause.
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=60"
          pkgs="xfsprogs dosfstools mtools grub-efi-amd64-bin skopeo qemu-system-x86 qemu-utils ovmf zstd openssl"
          for attempt in 1 2 3; do
            if sudo apt-get $APT update && sudo apt-get $APT install -y --fix-missing $pkgs; then break; fi
            [ "$attempt" = 3 ] && exit 1
            echo "apt failed (attempt $attempt), retrying in 60 s"; sleep 60
          done

      - name: Build the disk
        run: |
          sudo env TMPDIR=/mnt SOLYRA_IMAGE=solyra-base:ci \
            SOLYRA_AUTOLOGIN=1 SOLYRA_DEV_PASSWORD=solyra \
            ./scripts/build-disk.sh /mnt/solyra.raw 8G
          sudo chown "$USER" /mnt/solyra.raw
          ls -lh /mnt/solyra.raw

      - name: Boot smoke test (headless, serial console)
        run: |
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /mnt/vars.fd
          ACCEL="-accel tcg,thread=multi -cpu max"
          if [ -w /dev/kvm ]; then ACCEL="-accel kvm -cpu host"; fi
          # shellcheck disable=SC2086
          qemu-system-x86_64 $ACCEL -m 3072 -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=/mnt/vars.fd \
            -drive file=/mnt/solyra.raw,format=raw,if=virtio,snapshot=on \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -device virtio-rng-pci -display none -serial file:/mnt/serial.log &
          QPID=$!
          ok=0
          for _ in $(seq 1 90); do
            sleep 10
            if grep -q 'login:' /mnt/serial.log 2>/dev/null; then ok=1; break; fi
            if grep -qE 'Kernel panic|emergency mode|Failed to mount /sysroot' /mnt/serial.log 2>/dev/null; then break; fi
            kill -0 "$QPID" 2>/dev/null || break
          done
          kill "$QPID" 2>/dev/null || true
          tail -n 60 /mnt/serial.log || true
          if [ "$ok" != 1 ]; then echo "smoke test failed: no login prompt on the serial console"; exit 1; fi
          echo "smoke test passed: reached a login prompt"

      - name: VMware disk (.vmdk + .vmx), checked against the raw disk
        run: |
          mkdir -p /mnt/vmware
          qemu-img convert -p -f raw -O vmdk \
            -o subformat=monolithicSparse,adapter_type=lsilogic,hwversion=4 \
            /mnt/solyra.raw /mnt/vmware/solyra.vmdk
          # Every byte of the vmdk must read back as the raw disk.
          qemu-img compare -f raw -F vmdk /mnt/solyra.raw /mnt/vmware/solyra.vmdk
          cp base/vmware/solyra.vmx base/vmware/README.txt /mnt/vmware/
          ( cd /mnt/vmware && sha256sum solyra.vmdk solyra.vmx > SHA256SUMS && cat SHA256SUMS )
          ls -lh /mnt/vmware

      - uses: actions/upload-artifact@v4
        with:
          name: solyra-vmware
          path: /mnt/vmware/
          compression-level: 6
          retention-days: 14

      - name: Compress and checksum
        run: |
          zstd -T0 -6 --sparse /mnt/solyra.raw -o /mnt/solyra.raw.zst
          cp scripts/run-vm.sh /mnt/run-vm.sh
          ( cd /mnt && sha256sum solyra.raw.zst run-vm.sh > SHA256SUMS && cat SHA256SUMS )
          ls -lh /mnt/solyra.raw.zst

      - uses: actions/upload-artifact@v4
        with:
          name: solyra-disk
          path: |
            /mnt/solyra.raw.zst
            /mnt/run-vm.sh
            /mnt/SHA256SUMS
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-serial-log
          path: /mnt/serial.log
          if-no-files-found: ignore
