# Solyra Terminal: zgx's terminal example (crates/zgx-desktop/examples/
# terminal, MIT) adopted as Solyra's terminal. Its own workspace so it can
# follow zgx's newest revision without moving the other apps.
[workspace]
resolver = "3"

[package]
name = "solyra-term"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only AND MIT"
rust-version = "1.95"
publish = false

[[bin]]
name = "solyra-term"
path = "src/main.rs"

[dependencies]
zgx = { git = "https://github.com/zeronsh/zgx", rev = "3218e80e09a7cd9334d7a9c268f13bfb9858b6de" }
zgx-desktop = { git = "https://github.com/zeronsh/zgx", rev = "3218e80e09a7cd9334d7a9c268f13bfb9858b6de", features = ["terminal", "webkitgtk"] }
zgx-script = { git = "https://github.com/zeronsh/zgx", rev = "3218e80e09a7cd9334d7a9c268f13bfb9858b6de", default-features = false, features = ["components", "svg", "png"] }
zgx-run = { git = "https://github.com/zeronsh/zgx", rev = "3218e80e09a7cd9334d7a9c268f13bfb9858b6de", default-features = false }
serde_json = "1"
libc = "0.2"
vt100 = "0.16"

[build-dependencies]
zgx-script = { git = "https://github.com/zeronsh/zgx", rev = "3218e80e09a7cd9334d7a9c268f13bfb9858b6de", default-features = false }

# A dependency's [patch] never reaches an app, so the app repeats zgx's own
# (docs/getting-started.md in zeronsh/zgx): Wayland popups, AccessKit fixes.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/zeronsh/zgx", rev = "3218e80e09a7cd9334d7a9c268f13bfb9858b6de" }
winit = { git = "https://github.com/zeronsh/zgx", rev = "3218e80e09a7cd9334d7a9c268f13bfb9858b6de" }
accesskit_unix = { git = "https://github.com/zeronsh/zgx", rev = "3218e80e09a7cd9334d7a9c268f13bfb9858b6de" }
accesskit_atspi_common = { git = "https://github.com/zeronsh/zgx", rev = "3218e80e09a7cd9334d7a9c268f13bfb9858b6de" }
accesskit_consumer = { git = "https://github.com/zeronsh/zgx", rev = "3218e80e09a7cd9334d7a9c268f13bfb9858b6de" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
