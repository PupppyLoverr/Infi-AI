[package]
name = "cosmos-agents"
description = "CosmosOS agent manager — policies, live audit feed, snapper rollback"
edition = "2021"
license = "MIT"
version = "0.1.0"

[dependencies]
cosmos-uitk = { path = "../../uitk" }
egui = { workspace = true }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "cosmos-agents"
path = "src/main.rs"
