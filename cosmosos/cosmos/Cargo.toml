[workspace]
resolver = "2"
members = [
    "compositor",
    "ipc",
    "shell",
    # Added as they are implemented:
    #   "uitk", "apps/terminal", "apps/files", "apps/editor",
    #   "apps/settings", "apps/monitor", "apps/demo",
]

[workspace.dependencies]
smithay = { version = "0.7.0", default-features = false }
smithay-client-toolkit = { version = "0.21", default-features = false }
egui = "0.36"
epaint = "0.36"
winit = { version = "0.30", default-features = false }
softbuffer = "0.4"
tiny-skia = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
xkbcommon = "0.8"
calloop = { version = "0.14", features = ["executor"] }
calloop-wayland-source = "0.4"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
