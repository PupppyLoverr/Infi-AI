[package]
name = "cosmos-agentd"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "CosmosOS agent runtime — MCP socket server"

[dependencies]
cosmos-ipc = { path = "../ipc" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", features = ["blocking"] }
