# SPDX-License-Identifier: GPL-2.0-only
# xnudrmd's virglrenderer backend as a Venus client meets it (gpu/xnu-drm/test/virgl.c), on virglrenderer built the way
# tools/dgx-spark has it (Ubuntu's own has no render server) with Mesa's llvmpipe as the renderer's Vulkan device: the
# runner has no GPU.
name: xnu-drm-virgl
on:
  push:
    paths: [.github/workflows/xnu-drm-virgl.yml, gpu/xnu-drm/**, tools/dgx-spark/gpu/build-virglrenderer.sh]
  pull_request:
    paths: [.github/workflows/xnu-drm-virgl.yml, gpu/xnu-drm/**, tools/dgx-spark/gpu/build-virglrenderer.sh]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: virglrenderer with Venus, and llvmpipe
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mesa-vulkan-drivers
          W=$RUNNER_TEMP/virglrenderer tools/dgx-spark/gpu/build-virglrenderer.sh
      - name: xnudrmd's virglrenderer backend
        shell: bash
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          make -C gpu/xnu-drm test-virgl 2>&1 | tee "$RUNNER_TEMP/virgl.txt"
          # (the test passes where there is no renderer or no device to test with, and says so: here there are both)
          ! grep -E "NOT TESTED|no Vulkan device" "$RUNNER_TEMP/virgl.txt"
