<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Geist</family>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Geist</family>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Geist Mono</family>
      <family>JetBrains Mono</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Geist</string>
    </test>
    <test name="weight" compare="less">
      <const>medium</const>
    </test>
    <edit name="weight" mode="assign" binding="strong">
      <const>medium</const>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Geist Mono</string>
    </test>
    <test name="weight" compare="less">
      <const>medium</const>
    </test>
    <edit name="weight" mode="assign" binding="strong">
      <const>medium</const>
    </edit>
  </match>
</fontconfig>
