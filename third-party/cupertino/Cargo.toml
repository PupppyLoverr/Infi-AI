    "crates/cupertino-apps",
    "crates/cupertino-assets",
    "crates/cupertino-defaults",
    "crates/cupertino-diagnostic-events",
    "crates/cupertino-files",
    "crates/cupertino-geometry",
    "crates/cupertino-gpu",
    "crates/cupertino-icons",
    "crates/cupertino-keyboard",
    "crates/cupertino-kit",
    "crates/cupertino-menu-model",
    "crates/cupertino-raster-math",
    "crates/cupertino-theme",
    "crates/cupertino-trash",
    "crates/cupertino-ui-controls",
    "crates/cupertino-ui-core",
    "crates/cupertino-ui-files",
    "crates/cupertino-ui-render",
    "crates/cupertino-ui-text",
